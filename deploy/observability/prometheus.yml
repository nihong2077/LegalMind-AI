# LegalMind 可观测采集（T3.4）
# 以 compose profile `observability` 启用（默认不启）：
#   docker compose --profile observability up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 后端 API：HTTP/LLM/Kafka 指标（/metrics 由 T0.11 提供）
  - job_name: legalmind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8000"]

  # 协同 worker 三角色：心跳/消费/lag/轮次指标（各自 :8001 /metrics）
  - job_name: legalmind-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "worker-collab:8001"
          - "worker-memory:8001"
          - "worker-doc:8001"

  # LiteLLM 网关（模型调用侧指标，可选）
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]
