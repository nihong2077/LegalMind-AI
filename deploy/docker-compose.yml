services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      # 密钥隔离：真实厂商 key 绝不注入后端容器；LLM 一律经（外部）LiteLLM 代理调用
      - LITELLM_PROXY_URL=http://litellm:4000
      - LITELLM_VIRTUAL_KEY=${LITELLM_VIRTUAL_KEY}
    depends_on:
      - redis

  frontend:
    build:
      context: ../frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    image: legalmind-frontend:local
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
