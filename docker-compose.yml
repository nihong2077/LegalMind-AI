services:
  redis:
    image: redis:7-alpine
    container_name: legalmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --maxmemory-samples 5
      --hz 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: legalmind-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: judge_db
      POSTGRES_USER: legalmind
      POSTGRES_PASSWORD: ${PG_PASSWORD:-legalmind_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d judge_db -U legalmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: legalmind-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant 镜像不含 curl/wget，用 bash 内建 /dev/tcp 探活（T0.11）
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  litellm-db:
    image: postgres:16-alpine
    container_name: legalmind-litellm-db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm_secure_2024}
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # T0.7：OTel trace 后端。all-in-one 默认开 OTLP gRPC :4317，UI :16686。
  # 关容器时后端仅导出失败（后台批量、静默重试），业务不受影响。
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: legalmind-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC（供宿主侧本地进程直连，可选）
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # T0.8：Kafka KRaft 单节点（broker+controller 同进程）。生产需换多节点集群。
  kafka:
    image: apache/kafka:3.7.2
    container_name: legalmind-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_TIME_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # 一次性任务：建 3 个业务 topic（3 partition、单副本），--if-not-exists 可重复执行
  kafka-init:
    image: apache/kafka:3.7.2
    container_name: legalmind-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in collab-turns memory-events doc-tasks; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: legalmind-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm_secure_2024}@litellm-db:5432/litellm
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORE_MODEL_IN_DB=True
    command: ["--config=/app/config.yaml", "--port=4000"]
    depends_on:
      litellm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: legalmind-backend:local
    container_name: legalmind-api
    # GPU 透传给 embedding/reranker（需宿主已装 nvidia-container-toolkit）。
    # 无 GPU 的机器上可整体删除本段，应用会自动回退 CPU。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PG_JUDGE_URL=postgresql+asyncpg://legalmind:${PG_PASSWORD:-legalmind_secure_2024}@postgres:5432/judge_db
      - PG_LAWYER_URL=postgresql+asyncpg://legalmind:${PG_PASSWORD:-legalmind_secure_2024}@postgres:5432/lawyer_db
      - PG_LAW_URL=postgresql+asyncpg://legalmind:${PG_PASSWORD:-legalmind_secure_2024}@postgres:5432/law_db
      - PG_APP_URL=postgresql+asyncpg://legalmind:${PG_PASSWORD:-legalmind_secure_2024}@postgres:5432/legalmind_app
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production-use-at-least-32-chars}
      - LITELLM_PROXY_URL=http://litellm:4000
      - LITELLM_VIRTUAL_KEY=${LITELLM_VIRTUAL_KEY}
      # 密钥隔离：真实 DEEPSEEK_API_KEY 绝不注入 API 容器，仅由 litellm 服务消费；
      # 后端一律经 LITELLM_PROXY_URL + LITELLM_VIRTUAL_KEY（虚拟 key）调用 LLM。
      # T0.7 OpenTelemetry（常开；jaeger 宕机仅丢 trace，不阻断业务）
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=legalmind-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # T0.8 Kafka（默认关；开启后懒连，broker 故障自动降级不阻断业务）
      - ENABLE_KAFKA=${ENABLE_KAFKA:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLIENT_ID=legalmind-backend
    volumes:
      # T3.4：与 worker-doc 共享上传目录，OCR 异步链路需读取上传的文档原件
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---- T0.10 协同 worker：同镜像、不同 --role（骨架：心跳+:8001+Kafka 空转）----
  worker-collab:
    image: legalmind-backend:local
    container_name: legalmind-worker-collab
    command: ["python", "-m", "app.worker.main", "--role", "collab"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=legalmind-worker-collab
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ENABLE_KAFKA=${ENABLE_KAFKA:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLIENT_ID=legalmind-worker-collab
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker-memory:
    image: legalmind-backend:local
    container_name: legalmind-worker-memory
    command: ["python", "-m", "app.worker.main", "--role", "memory"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=legalmind-worker-memory
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ENABLE_KAFKA=${ENABLE_KAFKA:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLIENT_ID=legalmind-worker-memory
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker-doc:
    image: legalmind-backend:local
    container_name: legalmind-worker-doc
    command: ["python", "-m", "app.worker.main", "--role", "doc"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=legalmind-worker-doc
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ENABLE_KAFKA=${ENABLE_KAFKA:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLIENT_ID=legalmind-worker-doc
      # T3.4：OCR 异步链路鉴权（走 PaddleOCR AIStudio 任务 API）
      - OCR_API_TOKEN=${OCR_API_TOKEN:-}
    volumes:
      # T3.4：与 fastapi 共享上传目录，消费 doc-tasks 时读取原始文档
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalmind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped

  # ---- T3.4 可观测（profile=observability，默认不启）----
  #   docker compose --profile observability up -d
  #   Prometheus :9090；Grafana :3001（预置看板见 deploy/observability/…）
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: legalmind-prometheus
    profiles: ["observability"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: legalmind-grafana
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  litellm_db_data:
  kafka_data:
  uploads_data:
  grafana_data:
